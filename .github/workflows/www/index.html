<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آموزش کسرها</title>
<style>
body{margin:0;font-family:sans-serif;background:#f3f6fb;color:#222}
header{background:#3949ab;color:#fff;padding:12px;text-align:center}
header h1{margin:0;font-size:22px}
header small{display:block;margin-top:4px;font-size:14px}
main{max-width:640px;margin:auto;padding:12px}
footer{text-align:center;padding:14px;color:#555;font-size:14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px #0002}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.row button,.row select{flex:1;padding:10px 4px;border:2px solid #3949ab;background:#fff;color:#3949ab;border-radius:8px;font-size:14px}
.row button.on{background:#3949ab;color:#fff}
.q{font-size:28px;text-align:center;padding:10px}
.q.w{font-size:18px;line-height:2.3;text-align:right}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block}
.fr{display:inline-flex;flex-direction:column;align-items:stretch;text-align:center;vertical-align:middle;margin:0 5px;font-size:.85em;line-height:1.3}
.fr i{font-style:normal;padding:0 6px;display:block}
.fr i:first-child{border-bottom:2px solid currentColor;padding-bottom:1px}
.fr i:last-child{padding-top:1px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:20px;direction:ltr;text-align:center;border:2px solid #aaa;border-radius:8px;margin-bottom:6px}
.go{width:100%;padding:12px;font-size:17px;border:0;border-radius:8px;background:#43a047;color:#fff;margin-top:6px}
.go.b{background:#3949ab}.go.o{background:#fb8c00}
.ok{color:#2e7d32;font-weight:bold;font-size:18px}.no{color:#c62828;font-weight:bold;font-size:18px}
.st{padding:8px 0;border-bottom:1px dashed #ccc;line-height:2.2}
.fin{font-size:20px;font-weight:bold;color:#3949ab;padding-top:8px}
.hide{display:none}
</style>
</head>
<body>
<header><h1>🧮 آموزش کسرها</h1><small>طراح: منوچهر کریمی</small></header>
<main>
<div class="row">
  <button id="tP" class="on">تمرین</button>
  <button id="tT">مقایسه و اعشار</button>
  <button id="tC">ماشین‌حساب</button>
</div>
<div class="row" id="viz">
  <button data-v="bar" class="on">📊 شکل نواری</button>
  <button data-v="pie">🍕 شکل دایره‌ای</button>
</div>

<div id="pP">
  <div class="card">
    <div class="row" id="ops">
      <button data-v="+" class="on">جمع</button>
      <button data-v="-">تفریق</button>
      <button data-v="×">ضرب</button>
      <button data-v="÷">تقسیم</button>
    </div>
    <div class="row" id="kinds">
      <button data-v="same" class="on">مخرج مساوی</button>
      <button data-v="diff">مخرج نامساوی</button>
      <button data-v="mixed">عدد مخلوط</button>
      <button data-v="word">مسئله کلامی</button>
    </div>
    <div class="row" id="lvls">
      <button data-v="0">آسان</button>
      <button data-v="1" class="on">متوسط</button>
      <button data-v="2">سخت</button>
    </div>
    <div class="q" id="q"></div>
    <input id="ans" placeholder="جواب شما، مثل ۳/۴ یا ۲ ۱/۳">
    <button class="go" id="chk">بررسی جواب</button>
    <button class="go o" id="show">نمایش حل</button>
    <button class="go b" id="nxt">سوال جدید</button>
    <div style="text-align:center;margin-top:8px">درست: <b id="sc">۰</b> از <b id="tt">۰</b></div>
  </div>
</div>

<div id="pT" class="hide">
  <div class="card">
    <input id="ta" placeholder="کسر اول، مثل ۳/۴ یا ۰٫۷۵">
    <input id="tb" placeholder="کسر دوم (اختیاری)، مثل ۵/۶">
    <button class="go b" id="tg">مقایسه و تبدیل به اعشار</button>
  </div>
</div>

<div id="pC" class="hide">
  <div class="card">
    <input id="ca" placeholder="کسر اول، مثل ۳ ۱/۲">
    <div class="row"><select id="co"><option value="+">جمع +</option><option value="-">تفریق −</option><option value="×">ضرب ×</option><option value="÷">تقسیم ÷</option></select></div>
    <input id="cb" placeholder="کسر دوم، مثل ۵/۴">
    <button class="go b" id="cg">حل کن</button>
  </div>
</div>

<div class="card hide" id="outc"><div id="fb"></div><div id="out"></div></div>
</main>
<footer>طراح و برنامه‌نویس: منوچهر کریمی</footer>

<script>
const $=id=>document.getElementById(id);
const gcd=(a,b)=>b?gcd(b,a%b):a,lcm=(a,b)=>a*b/gcd(a,b),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const fa=s=>String(s).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function setH(el,h){el.innerHTML=h;const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())n.nodeValue=fa(n.nodeValue);}
const fr=(n,d)=>`<span class="fr"><i>${n}</i><i>${d}</i></span>`,E=h=>`<span class="m">${h}</span>`,imp=o=>o.w*o.d+o.n;
const M=o=>o.n?(o.w||'')+fr(o.n,o.d):''+o.w,F=(n,d)=>M({w:Math.floor(n/d),n:n%d,d});
function dec(n,d){const g=gcd(n,d);let q=d/g;while(q%2==0)q/=2;while(q%5==0)q/=5;const v=n/d;return q===1?String(v).replace('.','٫'):'≈ '+v.toFixed(4).replace('.','٫')+' (اعشار متناوب)';}
const decStep=o=>`<div class="st">تبدیل اعشار به کسر: ${E(o.dec.s+' = '+fr(o.dec.n,o.dec.d)+' = '+M(o))}</div>`;

let vis='bar';
const V=r=>vis==='pie'?pies(r):bars(r);
function bars(rows){let y=0,s='';
  rows.forEach(([n,d,c,t])=>{const W=Math.max(1,Math.ceil(n/d)),bw=(300-(W-1)*8)/W,cw=bw/d;
    s+=`<text x="0" y="${y+12}" font-size="13" fill="#333">${t}: ${n}/${d}</text>`;
    for(let k=0;k<W;k++){const f=Math.max(0,Math.min(d,n-k*d));
      for(let i=0;i<d;i++)s+=`<rect x="${k*(bw+8)+i*cw}" y="${y+18}" width="${cw}" height="24" fill="${i<f?c:'#fff'}" stroke="#555" stroke-width=".6"/>`;}
    y+=52;});
  return `<svg viewBox="0 0 300 ${y}" style="width:100%;direction:ltr">${s}</svg>`;}
function pies(rows){let y=0,s='';
  rows.forEach(([n,d,c,t])=>{const W=Math.min(6,Math.max(1,Math.ceil(n/d)));
    s+=`<text x="0" y="${y+12}" font-size="13" fill="#333">${t}: ${n}/${d}</text>`;
    for(let k=0;k<W;k++){const f=Math.max(0,Math.min(d,n-k*d)),cx=22+k*50,cy=y+42;
      for(let i=0;i<d;i++){const a=2*Math.PI*i/d-Math.PI/2,b=2*Math.PI*(i+1)/d-Math.PI/2;
        const p=d===1?`M${cx-22} ${cy}a22 22 0 1 0 44 0a22 22 0 1 0 -44 0`:`M${cx} ${cy}L${cx+22*Math.cos(a)} ${cy+22*Math.sin(a)}A22 22 0 0 1 ${cx+22*Math.cos(b)} ${cy+22*Math.sin(b)}Z`;
        s+=`<path d="${p}" fill="${i<f?c:'#fff'}" stroke="#555" stroke-width=".8"/>`;}}
    y+=74;});
  return `<svg viewBox="0 0 300 ${y}" style="width:100%;direction:ltr">${s}</svg>`;}
function grid(n1,d1,n2,d2){const cs=Math.min(28,260/Math.max(d1,d2));let s='';
  for(let c=0;c<d1;c++)for(let r=0;r<d2;r++){const a=c<n1,b=r<n2;
    s+=`<rect x="${c*cs}" y="${r*cs}" width="${cs}" height="${cs}" fill="${a&&b?'#ab47bc':a?'#90caf9':b?'#ffcc80':'#fff'}" stroke="#555" stroke-width=".6"/>`;}
  return `<svg viewBox="0 0 ${d1*cs} ${d2*cs}" style="display:block;margin:auto;max-width:300px;width:100%">${s}</svg>
  <div class="st">🟦 آبی = ${E(fr(n1,d1))} (ستون‌ها) &nbsp; 🟧 نارنجی = ${E(fr(n2,d2))} (سطرها) &nbsp; 🟪 بنفش (محل برخورد) = حاصل‌ضرب</div>`;}

const WHY={'+':'روی هم گذاشتن مقدارها یعنی جمع.','-':'«چقدر ماند» یعنی تفریق.','×':'«کسری از یک مقدار» یعنی ضرب.','÷':'«به چند تکه تقسیم می‌شود» یعنی تقسیم.'};
function solve(a,b,op,word){
  const S=[];let n1=imp(a),d1=a.d,n2=imp(b),d2=b.d,rn,rd,vis2;
  if(word)S.push('فهمیدن مسئله: '+WHY[op]);
  if(a.dec)S.push(decStep(a).replace(/<\/?div[^>]*>/g,''));
  if(b.dec)S.push(decStep(b).replace(/<\/?div[^>]*>/g,''));
  if(a.w)S.push(`تبدیل عدد مخلوط اول به کسر: ${E(M(a)+' = '+fr(n1,d1))} (چون ${E(a.w+'×'+a.d+'+'+a.n+' = '+n1)})`);
  if(b.w)S.push(`تبدیل عدد مخلوط دوم به کسر: ${E(M(b)+' = '+fr(n2,d2))} (چون ${E(b.w+'×'+b.d+'+'+b.n+' = '+n2)})`);
  if(op==='+'||op==='-'){
    let L=d1;const w=op==='+'?'جمع':'تفریق';
    if(d1===d2)S.push(`مخرج‌ها برابرند (${d1}). پس فقط صورت‌ها را ${w} می‌کنیم و مخرج همان می‌ماند.`);
    else{L=lcm(d1,d2);const m1=L/d1,m2=L/d2;
      S.push(`مخرج‌ها نابرابرند. اول باید مخرج‌ها را یکی کنیم. ک.م.م ${d1} و ${d2} برابر ${L} است.`);
      S.push(`کسر اول را در ${m1} ضرب می‌کنیم: ${E(fr(n1,d1)+' = '+fr(n1*m1,L))}`);
      S.push(`کسر دوم را در ${m2} ضرب می‌کنیم: ${E(fr(n2,d2)+' = '+fr(n2*m2,L))}`);
      n1*=m1;n2*=m2;}
    rn=op==='+'?n1+n2:n1-n2;rd=L;
    S.push(`${w} صورت‌ها: ${E(fr(n1,L)+' '+(op==='+'?'+':'−')+' '+fr(n2,L)+' = '+fr(rn,rd))}`);
    vis2=V([[n1,L,'#42a5f5','کسر اول'],[n2,L,'#ffa726','کسر دوم'],[rn,rd,'#66bb6a','حاصل']]);
  }else if(op==='×'){
    rn=n1*n2;rd=d1*d2;
    S.push(`در ضرب، صورت در صورت و مخرج در مخرج ضرب می‌شود (مخرج مشترک لازم نیست): ${E(fr(n1,d1)+' × '+fr(n2,d2)+' = '+fr(n1+'×'+n2,d1+'×'+d2)+' = '+fr(rn,rd))}`);
    vis2=(!a.w&&!b.w)?grid(n1,d1,n2,d2):V([[n1,d1,'#42a5f5','کسر اول'],[n2,d2,'#ffa726','کسر دوم'],[rn,rd,'#66bb6a','حاصل']]);
  }else{
    S.push(`تقسیم یعنی ضرب در وارونه کسر دوم. وارونه ${E(fr(n2,d2))} می‌شود ${E(fr(d2,n2))}.`);
    rn=n1*d2;rd=d1*n2;
    S.push(`${E(fr(n1,d1)+' ÷ '+fr(n2,d2)+' = '+fr(n1,d1)+' × '+fr(d2,n2)+' = '+fr(rn,rd))}`);
    S.push('معنی تقسیم: ببینیم کسر دوم چند بار در کسر اول جا می‌شود.');
  }
  const g=gcd(rn,rd),sn=rn/g,sd=rd/g;
  if(g>1)S.push(`ساده کردن: صورت و مخرج را بر ${g} تقسیم می‌کنیم: ${E(fr(rn,rd)+' = '+fr(sn,sd))}`);
  if(sd>1&&sn>sd)S.push(`تبدیل به عدد مخلوط: ${E(sn+' ÷ '+sd)} برابر ${Math.floor(sn/sd)} با باقی‌مانده ${sn%sd} است، پس ${E(fr(sn,sd)+' = '+F(sn,sd))}`);
  if(op==='÷')vis2=V([[n1,d1,'#42a5f5','کسر اول'],[n2,d2,'#ffa726','کسر دوم'],[sn,sd,'#66bb6a','حاصل']]);
  S.push(`معادل اعشاری جواب: ${E(F(sn,sd))} = ${dec(sn,sd)}`);
  const html=S.map(t=>`<div class="st">${t}</div>`).join('')+`<div class="fin">✅ جواب نهایی: ${E(F(sn,sd))}</div><div style="margin-top:10px">${vis2}</div>`;
  return {html,sn,sd};
}

function cmp(a,b){
  const S=[];
  [a,b].forEach(o=>{if(o&&o.dec)S.push(decStep(o).replace(/<\/?div[^>]*>/g,''));});
  if(!b){const n=imp(a);
    S.push(`برای تبدیل کسر به اعشار، صورت را بر مخرج تقسیم می‌کنیم: ${E(n+' ÷ '+a.d)} = ${dec(n,a.d)}`);
    return S.map(t=>`<div class="st">${t}</div>`).join('');}
  const n1=imp(a),n2=imp(b),d1=a.d,d2=b.d;
  S.push(`اعشار کسر اول: ${E(M(a))} = ${dec(n1,d1)}`);
  S.push(`اعشار کسر دوم: ${E(M(b))} = ${dec(n2,d2)}`);
  const L=lcm(d1,d2),x=n1*L/d1,y=n2*L/d2,sym=x>y?'>':x<y?'<':'=';
  S.push(d1===d2?'مخرج‌ها برابرند؛ فقط صورت‌ها را مقایسه می‌کنیم.':`مخرج مشترک (ک.م.م) برابر ${L} است: ${E(fr(n1,d1)+' = '+fr(x,L)+' ، '+fr(n2,d2)+' = '+fr(y,L))}`);
  S.push(`مقایسه صورت‌ها: ${E(x+' '+sym+' '+y)}`);
  const res=x>y?'کسر اول بزرگ‌تر است':x<y?'کسر دوم بزرگ‌تر است':'دو کسر با هم برابرند';
  return S.map(t=>`<div class="st">${t}</div>`).join('')+`<div class="fin">✅ ${E(M(a)+' '+sym+' '+M(b))} ← ${res}</div><div style="margin-top:10px">${V([[x,L,'#42a5f5','کسر اول'],[y,L,'#ffa726','کسر دوم']])}</div>`;
}

function parse(s){
  s=s.replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[٫,]/g,'.');
  let m=/^\s*(\d*)\.(\d+)\s*$/.exec(s);
  if(m){const k=m[2],n=+(m[1]+k),d=Math.pow(10,k.length),g=gcd(n,d),t=n/g,q=d/g;
    return {w:Math.floor(t/q),n:t%q,d:q,dec:{s:(m[1]||'0')+'٫'+k,n,d}};}
  m=/^\s*(\d+)?\s*(?:(\d+)\s*\/\s*(\d+))?\s*$/.exec(s);
  if(!m||(!m[1]&&!m[2]))return null;
  const d=m[3]?+m[3]:1;if(!d)return null;
  return {w:+m[1]||0,n:+m[2]||0,d};
}

const WP={
'+':(a,b)=>`مریم ${a} کیلو سیب و رضا ${b} کیلو سیب خریدند. روی هم چند کیلو سیب خریده‌اند؟`,
'-':(a,b)=>`در یک بشکه ${a} لیتر آب بود. ${b} لیتر از آن مصرف شد. چند لیتر آب باقی ماند؟`,
'×':(a,b)=>`یک بطری ${a} لیتر آب‌میوه دارد. ${b} آن را نوشیدیم. چند لیتر آب‌میوه نوشیدیم؟`,
'÷':(a,b)=>`یک نوار ${a} متر طول دارد. آن را به تکه‌های ${b} متری می‌بُریم. چند تکه می‌شود؟`};

let op='+',kind='same',lvl=1,cur,sc=0,tt=0,answered=false;
function gen(){
  const dm=[6,9,12][lvl],wm=[2,4,5][lvl];
  const mk=(d,w)=>({w:w?rnd(1,wm):0,n:rnd(1,d-1),d});
  let a,b;
  if(kind==='same'){const d=rnd(3,dm);a=mk(d,0);b=mk(d,0);}
  else{const d1=rnd(2,dm);let d2;do{d2=rnd(2,dm)}while(d2===d1);
    const w=kind==='mixed'||(kind==='word'&&lvl===2);a=mk(d1,w);b=mk(d2,w);}
  if(kind==='word'&&op==='×')b.w=0;
  if(op==='-'&&imp(a)*b.d<imp(b)*a.d)[a,b]=[b,a];
  return {a,b};
}
function newQ(){
  cur=gen();answered=false;const q=$('q'),w=kind==='word';
  q.className='q'+(w?' w':'');
  setH(q,w?WP[op](E(M(cur.a)),E(M(cur.b))):E(M(cur.a)+' '+(op==='-'?'−':op)+' '+M(cur.b)+' = ?'));
  $('ans').value='';$('outc').classList.add('hide');
}
function showOut(html,fb){setH($('fb'),fb||'');setH($('out'),html);$('outc').classList.remove('hide');}
function group(id,cb){$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;
  [...$(id).children].forEach(x=>x.classList.remove('on'));b.classList.add('on');cb(b.dataset.v);newQ();};}
group('ops',v=>op=v);group('kinds',v=>kind=v);group('lvls',v=>lvl=+v);group('viz',v=>vis=v);
$('nxt').onclick=newQ;
$('show').onclick=()=>showOut(solve(cur.a,cur.b,op,kind==='word').html);
$('chk').onclick=()=>{
  const u=parse($('ans').value);
  if(!u){alert('جواب را به شکل ۳/۴ یا ۲ ۱/۳ بنویسید');return;}
  const r=solve(cur.a,cur.b,op,kind==='word'),ok=imp(u)*r.sd===r.sn*u.d;
  if(!answered){tt++;if(ok)sc++;answered=true;$('sc').textContent=fa(sc);$('tt').textContent=fa(tt);}
  showOut(r.html,ok?'<div class="ok">🎉 آفرین! درست است.</div>':'<div class="no">❌ درست نیست. حل را ببینید:</div>');
};
const tabs={tP:'pP',tT:'pT',tC:'pC'};
Object.keys(tabs).forEach(t=>$(t).onclick=()=>{
  Object.keys(tabs).forEach(k=>{$(tabs[k]).classList.toggle('hide',k!==t);$(k).classList.toggle('on',k===t);});
  $('outc').classList.add('hide');});
$('tg').onclick=()=>{
  const a=parse($('ta').value),sb=$('tb').value.trim(),b=sb?parse(sb):null;
  if(!a||(sb&&!b)){alert('کسرها را درست وارد کنید. مثل ۳/۴ یا ۰٫۷۵');return;}
  showOut(cmp(a,b));
};
$('cg').onclick=()=>{
  const a=parse($('ca').value),b=parse($('cb').value),o=$('co').value;
  if(!a||!b){alert('کسرها را درست وارد کنید. مثل ۳/۴ یا ۲ ۱/۳');return;}
  if(o==='÷'&&imp(b)===0){alert('تقسیم بر صفر ممکن نیست');return;}
  showOut(solve(a,b,o,false).html);
};
newQ();
</script>
</body>
</html>
